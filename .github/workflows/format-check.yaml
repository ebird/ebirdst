on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: format-check

permissions: read-all

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Air
        uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format . --check
