# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # The Posit binary for dotCall64 (R 4.6, sonoma-arm64) is compiled with OpenMP
      # and links against libomp.dylib at a path not present on the runner. setup-r
      # already strips -fopenmp from Makeconf, so recompiling from source produces a
      # .so with no libomp dependency. gettext is required to provide libintl.h.
      - name: Recompile dotCall64 from source (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gettext
          mkdir -p ~/.R
          printf 'CPPFLAGS += -I%s/include\nLDFLAGS += -L%s/lib\n' \
            "$(brew --prefix gettext)" "$(brew --prefix gettext)" >> ~/.R/Makevars
          Rscript -e 'install.packages("dotCall64", type = "source", repos = "https://cloud.r-project.org")'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
